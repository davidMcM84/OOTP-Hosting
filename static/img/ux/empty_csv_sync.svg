    <rect x="34" y="25" width="23" height="52" fill="#1D4ED8"/>
    <rect x="57" y="25" width="23" height="52" fill="#E11D48"/>
    <path d="M57 40 L69 52 L57 64 L45 52 Z" stroke="#FFFFFF" stroke-width="2.6" fill="none"/>
  </g>
  <path d="M57 46.5 V57.5 M51.5 52 H62.5" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="square"/>

  <!-- Center: Animated Data Pipeline -->
