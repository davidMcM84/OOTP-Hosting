  </defs>
  <!-- Left: Set 2 Broadcast Shield -->
  <path d="M31 22 H83 V58 L57 81 L31 58 Z" fill="url(#csPlat)"/>
  <path d="M33.8 24.8 H80.2 V56.8 L57 77.2 L33.8 56.8 Z" fill="#070D1F"/>
