  <path d="M146 46 C146 51.5, 190 51.5, 190 46" stroke="#64748B" stroke-width="1.5"/>
  <path d="M146 58 C146 63.5, 190 63.5, 190 58" stroke="#64748B" stroke-width="1.5"/>
  <text x="168" y="89" text-anchor="middle" fill="#CBD5E1" font-family="JetBrains Mono, monospace" font-weight="800" font-size="10">SQLITE WAL</text>
</svg>
