<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 40" fill="none">
  <defs>
    <linearGradient id="sbPlat" x1="0" y1="0" x2="264" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <clipPath id="sbMiniClip">
      <path d="M174 11 H190 V22.5 L182 29.5 L174 22.5 Z"/>
    </clipPath>
  </defs>
  <!-- Slanted BNN.COM Broadcast Tiles -->
  <g transform="skewX(-10)">
    <rect x="8" y="5" width="28" height="30" rx="4" fill="#E11D48"/>
    <rect x="9" y="6" width="26" height="28" rx="3" fill="#FFFFFF"/>
    <text x="22" y="27" text-anchor="middle" fill="#070D1F" font-family="Inter, Impact, sans-serif" font-weight="900" font-size="21">B</text>

    <rect x="39" y="5" width="28" height="30" rx="4" fill="#E11D48"/>
    <rect x="40" y="6" width="26" height="28" rx="3" fill="#FFFFFF"/>
    <text x="53" y="27" text-anchor="middle" fill="#070D1F" font-family="Inter, Impact, sans-serif" font-weight="900" font-size="21">N</text>

    <rect x="70" y="5" width="28" height="30" rx="4" fill="#E11D48"/>
    <rect x="71" y="6" width="26" height="28" rx="3" fill="#FFFFFF"/>
    <text x="84" y="27" text-anchor="middle" fill="#070D1F" font-family="Inter, Impact, sans-serif" font-weight="900" font-size="21">N</text>

    <rect x="102" y="8" width="52" height="24" rx="4" fill="#E11D48"/>
    <text x="128" y="24.5" text-anchor="middle" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-weight="800" font-size="13" letter-spacing="0.5">.COM</text>
  </g>

  <!-- Set 2 Broadcast Network OOTP+ Crest Pill -->
  <rect x="159" y="6" width="99" height="28" rx="6" fill="#070D1F" stroke="url(#sbPlat)" stroke-width="1.5"/>
  <!-- Mini Set 2 Shield -->
  <path d="M172 9.5 H192 V23.2 L182 31.5 L172 23.2 Z" fill="url(#sbPlat)"/>
  <g clip-path="url(#sbMiniClip)">
    <rect x="173" y="10" width="9" height="21" fill="#1D4ED8"/>
    <rect x="182" y="10" width="9" height="21" fill="#E11D48"/>
    <path d="M182 15.5 L187 20.5 L182 25.5 L177 20.5 Z" stroke="#FFFFFF" stroke-width="1.4" fill="none"/>
  </g>
  <path d="M182 18 V23 M179.5 20.5 H184.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="square"/>
  <!-- OOTP+ Wordmark -->
  <text x="197" y="25" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="14.5" letter-spacing="0.3">OOTP<tspan fill="#E11D48">+</tspan></text>
</svg>
